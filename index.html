<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn Navigation Bar</title>
    <link rel="stylesheet" href="style.css" >
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <!-- LinkedIn Logo -->
            <div class="nav-logo">
                <svg viewBox="0 0 24 24">
                    <path d="M20.447 20.452H16.893V14.883C16.893 13.555 16.866 11.846 15.041 11.846C13.188 11.846 12.905 13.291 12.905 14.785V20.452H9.351V9H12.765V10.561H12.811C13.288 9.661 14.448 8.711 16.181 8.711C19.782 8.711 20.448 11.081 20.448 14.166V20.452H20.447ZM5.337 7.433C4.193 7.433 3.274 6.507 3.274 5.368C3.274 4.23 4.194 3.305 5.337 3.305C6.477 3.305 7.401 4.23 7.401 5.368C7.401 6.507 6.476 7.433 5.337 7.433ZM7.119 20.452H3.555V9H7.119V20.452ZM22.225 0H1.771C0.792 0 0 0.774 0 1.729V22.271C0 23.227 0.792 24 1.771 24H22.222C23.2 24 24 23.227 24 22.271V1.729C24 0.774 23.2 0 22.222 0H22.225Z"/>

            <ul class="nav-items">
                <li class="nav-item">
                    <a href="#" class="nav-link active">
                        <svg class="nav-icon" viewBox="0 0 24 24">

                        </svg>
                        <span class="nav-text">Home</span>
                    </a>
                </li>
                
                <li class="nav-item">
                    <a href="#" class="nav-link">
                        <svg class="nav-icon" viewBox="0 0 24 24">
                            <path d="M12 16v6H3v-6a3 3 0 013-3h3a3 3 0 013 3zm5.5-3A3.5 3.5 0 1014 9.5a3.5 3.5 0 003.5 3.5zm1 2h-2a2.5 2.5 0 00-2.5 2.5V22h7v-4.5A2.5 2.5 0 0018.5 15zM7.5 2A4.5 4.5 0 1012 6.5 4.49 4.49 0 007.5 2z"/>
                        </svg>
                        <span class="nav-text">My Network</span>
                    </a>
                </li>
                
                <li class="nav-item">
                    <a href="#" class="nav-link">
                        <svg class="nav-icon" viewBox="0 0 24 24">

                        </svg>
                        <span class="nav-text">Jobs</span>
                    </a>
                </li>
                
                <li class="nav-item">
                    <a href="#" class="nav-link">
                        <svg class="nav-icon" viewBox="0 0 24 24">
                            <path d="M16 4H8a7 7 0 000 14h4v4l8.16-5.39A6.78 6.78 0 0023 11a7 7 0 00-7-7zm-8 8.25A1.25 1.25 0 119.25 11 1.25 1.25 0 018 12.25zm4 0A1.25 1.25 0 1113.25 11 1.25 1.25 0 0112 12.25zm4 0A1.25 1.25 0 1117.25 11 1.25 1.25 0 0116 12.25z"/>
                        </svg>
                        <span class="nav-text">Messaging</span>
                        <div class="notification-badge">2</div>
                    </a>
                </li>
                
                <li class="nav-item">
                    <a href="#" class="nav-link">
                        <svg class="nav-icon" viewBox="0 0 24 24">
                            <path d="M22 19h-8.28a2 2 0 11-3.44 0H2v-1a4.52 4.52 0 011.17-2.83l1-1.17h15.7l1 1.17A4.42 4.42 0 0122 18zM18.21 7.44A6.27 6.27 0 0012 2a6.27 6.27 0 00-6.21 5.44L5 13h14z"/>
                        </svg>
                        <span class="nav-text">Notifications</span>
                        <div class="notification-badge">5</div>
                    </a>
                </li>
                
                <li class="nav-item profile-dropdown">
                    <a href="#" class="nav-link">
                        <div class="profile-pic"></div>
                        <span class="nav-text">Me</span>
                    </a>
                </li>
                
                <div class="nav-divider"></div>
                
                <li class="nav-item">
                    <a href="#" class="nav-link">
                        <svg class="nav-icon" viewBox="0 0 24 24">
                            <path d="M3 3h4v4H3zm7 4h4V3h-4zm7-4v4h4V3zM3 14h4v-4H3zm7 0h4v-4h-4zm7 0h4v-4h-4zM3 21h4v-4H3zm7 0h4v-4h-4zm7 0h4v-4h-4z"/>
                        </svg>
                        <span class="nav-text">Work</span>
                    </a>
                </li>
            </ul>
            
            <!-- Premium Link -->
            <a href="#" class="nav-premium">
                <span class="premium-text">Try Premium for Free</span>
            </a>
        </div>
    </nav>
    <!-- Content placeholder to show navbar positioning -->
    <div style="margin-top: 70px; padding: 20px; text-align: center;">
        <h2>LinkedIn Navigation Bar By <span style="color: red;">Rida Mellal</span></h2>
        
    </div>
    <script src="script.js"></script>

</html>
